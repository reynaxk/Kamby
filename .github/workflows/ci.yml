name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://kamby:kamby@localhost:5432/kamby?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-test-secret-not-for-production-use
  CHAIN_ID: 8453
  CHAIN_RPC_URL: https://mainnet.base.org
  # KyberSwap's Aggregator API needs no API key — KYBERSWAP_CLIENT_ID defaults to "kamby",
  # nothing to set here. CI hits the real, keyless KyberSwap API; the e2e suite's fixture
  # token addresses are synthetic (never deployed), so the real API legitimately has no
  # route for them — the suite verifies that's turned into an honest "quote unavailable"
  # response, not a crash. See docs/TESTING.md.
  PLATFORM_FEE_RECIPIENT_ADDRESS: '0x1234567890123456789012345678901234567890'
  USDC_CONTRACT_ADDRESS: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'

jobs:
  ci:
    name: Install → Lint → Typecheck → Migrate → Test → Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: kamby
          POSTGRES_PASSWORD: kamby
          POSTGRES_DB: kamby
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kamby -d kamby"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate schema and apply migrations
        run: |
          pnpm --filter @kamby/db exec prisma validate
          pnpm --filter @kamby/db exec prisma migrate deploy

      - name: Unit tests
        run: pnpm test

      - name: API e2e tests (health, market, social, identity, trade — against live Postgres + Redis)
        run: pnpm --filter @kamby/api test:e2e

      - name: Build
        run: pnpm build
