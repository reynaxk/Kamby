# Local development only. Production uses managed Postgres (with the Timescale extension)
# and managed Redis — see /docs/DEPLOYMENT.md.
services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kamby
      POSTGRES_PASSWORD: kamby
      POSTGRES_DB: kamby
    ports:
      - '5432:5432'
    volumes:
      - kamby_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kamby -d kamby']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - kamby_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kamby_postgres_data:
  kamby_redis_data:
